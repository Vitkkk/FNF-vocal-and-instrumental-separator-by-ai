name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk
    paths:
      - "android/**"
      - "model/**"
      - "scripts/export_v31_onnx.py"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve V3.1 checkpoint
        run: |
          mkdir -p model
          if [ -f model/best_model_v31.pt ]; then
            echo "Checkpoint already exists in android-apk/model."
          else
            git fetch origin main
            if git cat-file -e origin/main:melhor_modelo_v31.pt 2>/dev/null; then
              git show origin/main:melhor_modelo_v31.pt > model/best_model_v31.pt
              echo "Copied root checkpoint from main: melhor_modelo_v31.pt"
            elif git cat-file -e origin/main:best_model_v31.pt 2>/dev/null; then
              git show origin/main:best_model_v31.pt > model/best_model_v31.pt
              echo "Copied root checkpoint from main: best_model_v31.pt"
            else
              echo "No V3.1 checkpoint found in android-apk/model or main root."
            fi
          fi
          ls -lh model || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Export V3.1 checkpoint to ONNX
        if: ${{ hashFiles('model/best_model_v31.pt') != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          pip install onnx==1.18.0 onnxscript==0.3.2
          mkdir -p android/app/src/main/assets
          python scripts/export_v31_onnx.py \
            --checkpoint model/best_model_v31.pt \
            --output android/app/src/main/assets/fnf_separator_v31.onnx
          ls -lh android/app/src/main/assets/fnf_separator_v31.onnx

      - name: Check embedded model status
        run: |
          if [ -f android/app/src/main/assets/fnf_separator_v31.onnx ]; then
            echo "ONNX model will be bundled into the APK."
          else
            echo "No checkpoint found: building APK with manual ONNX import fallback."
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/FNF-Separator-v0.2-debug.apk
          if [ -f android/app/src/main/assets/fnf_separator_v31.onnx ]; then
            cp android/app/src/main/assets/fnf_separator_v31.onnx dist/fnf_separator_v31.onnx
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Separator-Android-APK
          path: |
            dist/FNF-Separator-v0.2-debug.apk
            dist/fnf_separator_v31.onnx
          if-no-files-found: error
          retention-days: 30
